[package]
name = "rust_bevy_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.15", features = ["dynamic_linking"] }
futures-lite = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Enable high optimizations for dependencies (very important for Bevy)
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
